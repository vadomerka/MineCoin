server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  application:
    name: finance-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${FLYWAY_ENABLED:false}

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s

app:
  finance:
    max-operation-amount: ${MAX_OPERATION_AMOUNT:1000}
  jwt:
    secret: ${JWT_SECRET}
  user-service:
    url: ${USER_SERVICE_URL}
    connect-timeout: 2s
    read-timeout: 3s
  fault:
    delay: ${FAULT_DELAY:0ms}
    error-rate: ${FAULT_ERROR_RATE:0}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
