<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MineCoin</title>
    <link rel="stylesheet" href="css/pico-2.1.1.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
<header class="container">
    <nav>
        <ul>
            <li><strong>MineCoin</strong></li>
        </ul>
        <ul id="user-menu" hidden>
            <li id="current-username"></li>
            <li><button id="logout-button" class="secondary outline">Выйти</button></li>
        </ul>
    </nav>
</header>

<main class="container">
    <section id="auth-screen" hidden>
        <article id="login-card">
            <header><h2>Вход</h2></header>
            <form id="login-form">
                <label>
                    Логин
                    <input name="username" autocomplete="username" required maxlength="32">
                </label>
                <label>
                    Пароль
                    <input name="password" type="password" autocomplete="current-password" required maxlength="72">
                </label>
                <p class="form-error" role="alert" hidden></p>
                <button type="submit">Войти</button>
            </form>
            <footer>Нет аккаунта? <a href="#" id="show-register">Зарегистрироваться</a></footer>
        </article>

        <article id="register-card" hidden>
            <header><h2>Регистрация</h2></header>
            <form id="register-form">
                <label>
                    Логин
                    <input name="username" autocomplete="username" required minlength="3" maxlength="32"
                           pattern="[A-Za-z0-9_]+">
                    <small>От 3 до 32 символов: латинские буквы, цифры и _</small>
                </label>
                <label>
                    Email
                    <input name="email" type="email" autocomplete="email" required maxlength="255">
                </label>
                <label>
                    Имя (необязательно)
                    <input name="displayName" autocomplete="nickname" maxlength="64">
                </label>
                <label>
                    Пароль
                    <input name="password" type="password" autocomplete="new-password" required minlength="8"
                           maxlength="72">
                    <small>От 8 до 72 символов</small>
                </label>
                <p class="form-error" role="alert" hidden></p>
                <button type="submit">Зарегистрироваться</button>
            </form>
            <footer>Уже есть аккаунт? <a href="#" id="show-login">Войти</a></footer>
        </article>
    </section>

    <section id="app-screen" hidden>
        <article id="profile-card">
            <header><h2>Профиль</h2></header>
            <div id="profile-view">
                <table>
                    <tbody>
                    <tr><th scope="row">Логин</th><td id="profile-username"></td></tr>
                    <tr><th scope="row">Email</th><td id="profile-email"></td></tr>
                    <tr><th scope="row">Имя</th><td id="profile-display-name"></td></tr>
                    <tr><th scope="row">Роль</th><td id="profile-role"></td></tr>
                    <tr><th scope="row">Зарегистрирован</th><td id="profile-created-at"></td></tr>
                    </tbody>
                </table>
                <div class="actions">
                    <button id="edit-profile-button">Изменить</button>
                    <button id="delete-account-button" class="secondary outline">Удалить аккаунт</button>
                </div>
            </div>
            <form id="profile-form" hidden>
                <label>
                    Email
                    <input name="email" type="email" autocomplete="email" required maxlength="255">
                </label>
                <label>
                    Имя (необязательно)
                    <input name="displayName" autocomplete="nickname" maxlength="64">
                </label>
                <p class="form-error" role="alert" hidden></p>
                <div class="actions">
                    <button type="submit">Сохранить</button>
                    <button type="button" id="cancel-edit-button" class="secondary outline">Отмена</button>
                </div>
            </form>
        </article>
    </section>

    <dialog id="delete-dialog">
        <article>
            <form id="delete-form">
                <h3>Удалить аккаунт?</h3>
                <p>Логин, email и имя будут стёрты без возможности восстановления. Деньги на кошельке станут
                    недоступны.</p>
                <p class="form-error" role="alert" hidden></p>
                <footer>
                    <button type="button" id="cancel-delete-button" class="secondary outline">Отмена</button>
                    <button type="submit">Удалить</button>
                </footer>
            </form>
        </article>
    </dialog>
</main>
</body>
</html>
