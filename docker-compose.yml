name: minecoin

x-user-env: &user-env
  DB_URL: ${USER_DB_URL}
  DB_USERNAME: ${USER_DB_USERNAME}
  DB_PASSWORD: ${USER_DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_TTL: ${JWT_TTL:-1h}

x-finance-env: &finance-env
  DB_URL: ${FINANCE_DB_URL}
  DB_USERNAME: ${FINANCE_DB_USERNAME}
  DB_PASSWORD: ${FINANCE_DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  USER_SERVICE_URL: ${USER_SERVICE_URL}
  MAX_OPERATION_AMOUNT: ${MAX_OPERATION_AMOUNT:-1000}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-migrate:
    image: minecoin/user-service:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: UserService/Dockerfile
    environment:
      <<: *user-env
      FLYWAY_ENABLED: "true"
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    image: minecoin/user-service:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      <<: *user-env
      SERVER_PORT: ${USER_SERVICE_PORT:-8081}
    ports:
      - "${USER_SERVICE_PORT:-8081}:${USER_SERVICE_PORT:-8081}"
    depends_on:
      postgres:
        condition: service_healthy
      user-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT}/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

  frontend:
    image: minecoin/frontend:${IMAGE_TAG:-dev}
    build:
      context: Frontend
    restart: unless-stopped
    environment:
      USER_SERVICE_UPSTREAM: user-service:${USER_SERVICE_PORT:-8081}
      FINANCE_SERVICE_UPSTREAM: finance-service:${FINANCE_SERVICE_PORT:-8082}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-create-admin:
    image: minecoin/user-service:${IMAGE_TAG:-dev}
    profiles: [tools]
    environment:
      <<: *user-env
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      CREATE_ADMIN_ENABLED: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      user-migrate:
        condition: service_completed_successfully

  finance-migrate:
    image: minecoin/finance-service:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: FinanceService/Dockerfile
    environment:
      <<: *finance-env
      FLYWAY_ENABLED: "true"
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    depends_on:
      postgres:
        condition: service_healthy

  finance-service:
    image: minecoin/finance-service:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      <<: *finance-env
      SERVER_PORT: ${FINANCE_SERVICE_PORT:-8082}
    ports:
      - "${FINANCE_SERVICE_PORT:-8082}:${FINANCE_SERVICE_PORT:-8082}"
    depends_on:
      postgres:
        condition: service_healthy
      finance-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT}/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres-data:
