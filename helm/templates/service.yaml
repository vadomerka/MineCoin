apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-keycloak
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-keycloak
  ports:
    {{- if .Values.tls.enabled }}
    - name: https
      port: 8443
      targetPort: https
    {{- else }}
    - name: http
      port: 8080
      targetPort: http
    {{- end }}
    - name: management
      port: 9000
      targetPort: management