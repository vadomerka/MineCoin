apiVersion: batch/v1
kind: Job
metadata:
  name: user-migrate
  namespace: minecoin
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: user-migrate
          image: minecoin/user-service:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: user-service-config
          env:
            - name: FLYWAY_ENABLED
              value: "true"
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: none
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecoin-secrets
                  key: USER_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: minecoin-secrets
                  key: JWT_SECRET