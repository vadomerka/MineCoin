apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: minecoin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: minecoin/frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: USER_SERVICE_UPSTREAM
              value: user-service.minecoin.svc.cluster.local:8081
            - name: FINANCE_SERVICE_UPSTREAM
              value: finance-service.minecoin.svc.cluster.local:8082
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: minecoin
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080