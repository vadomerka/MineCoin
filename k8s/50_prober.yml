apiVersion: v1
kind: ConfigMap
metadata:
  name: prober-config
  namespace: minecoin
data:
  PROBER_BASE_URL: http://frontend.minecoin.svc.cluster.local
  PROBER_USERNAME: prober
  PROBER_RECIPIENT: prober_sink
  PROBER_INTERVAL_SECONDS: "10"
  PROBER_TIMEOUT_SECONDS: "5"
  PROBER_METRICS_PORT: "9090"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prober
  namespace: minecoin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prober
  template:
    metadata:
      labels:
        app: prober
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: prober
          image: minecoin/prober:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: prober-config
          env:
            - name: PROBER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecoin-secrets
                  key: PROBER_PASSWORD
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 160Mi
