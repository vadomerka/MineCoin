global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [ alertname, application ]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: ${TELEGRAM_CHAT_ID}
        parse_mode: HTML
        send_resolved: true
        message: |
          {{ if eq .Status "firing" }}🔥 Сработал{{ else }}✅ Устранён{{ end }}: <b>{{ .CommonLabels.alertname }}</b>
          Важность: {{ .CommonLabels.severity }}, группа: {{ .CommonLabels.category }}
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          {{ if eq .Status "firing" }}{{ .Annotations.description }}{{ end }}
          {{ end }}
