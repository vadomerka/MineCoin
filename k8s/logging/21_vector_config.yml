apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: logging
data:
  vector.yaml: |
    data_dir: /vector-data-dir

    api:
      enabled: true
      address: 0.0.0.0:8686

    sources:
      minecoin_pods:
        type: kubernetes_logs
        extra_field_selector: metadata.namespace=minecoin

    transforms:
      normalize:
        type: remap
        inputs: [minecoin_pods]
        source: |
          structured, err = parse_json(.message)
          if err == null && is_object(structured) {
            . = merge(., object!(structured))
          }

          del(.kubernetes.pod_annotations)
          del(.kubernetes.namespace_labels)
          del(.kubernetes.node_labels)
          del(.kubernetes.pod_labels."pod-template-hash")
          del(.kubernetes.pod_uid)
          del(.kubernetes.pod_ips)
          del(.kubernetes.container_id)
          del(.kubernetes.container_image_id)
          del(.file)
          del(.source_type)

          . = flatten(., ".")

          if !exists(."service.name") {
            ."service.name" = ."kubernetes.container_name"
          }

          if !exists(."log.level") {
            found, err = parse_regex(.message, r'(?i)\b(?P<level>fatal|panic|emerg|alert|crit|error|warning|warn)\b')
            if err == null {
              ."log.level" = upcase(string!(found.level))
            } else {
              ."log.level" = "INFO"
            }
          }

          if includes(["FATAL", "PANIC", "EMERG", "ALERT", "CRIT"], ."log.level") {
            ."log.level" = "ERROR"
          }
          if ."log.level" == "WARNING" {
            ."log.level" = "WARN"
          }

    sinks:
      victorialogs:
        type: elasticsearch
        inputs: [normalize]
        endpoints: ["http://victorialogs.logging.svc.cluster.local:9428/insert/elasticsearch/"]
        mode: bulk
        api_version: v8
        compression: gzip
        healthcheck:
          enabled: false
        query:
          _msg_field: message
          _time_field: timestamp
          _stream_fields: kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name
