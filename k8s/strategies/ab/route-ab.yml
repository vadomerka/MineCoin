apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: finance
  namespace: minecoin
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/wallets
          headers:
            - type: Exact
              name: x-user-group
              value: beta
      backendRefs:
        - name: finance-service-v2
          port: 8082
    - matches:
        - path:
            type: PathPrefix
            value: /api/wallets
      backendRefs:
        - name: finance-service
          port: 8082
